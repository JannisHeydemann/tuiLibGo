# GitLab CI/CD pipeline
# For now this just builds and runs the C++ (GoogleTest) test suite.
# `make -C ctui run` compiles the test binary and executes it.

stages:
  - test

cpp-tests:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends g++ make libgtest-dev
  script:
    - make -C ctui run
